version: '3.8'

services:
  # --- Фронтенд (Vite + TypeScript) ---
  frontend:
    build:
      context: ./yt-kachalka-frontend/
      dockerfile: ./Dockerfile
    container_name: yt-kachalka-frontend
    ports:
      - "8080:8080" # Порт для доступа к Vite Dev Server из браузера
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true # Для корректной работы hot-reload на некоторых ОС (например, Windows/Mac)
      - VITE_API_URL=http://nginx
    networks:
      - app-network

  # --- Бэкенд API (PHP-FPM + Nginx для HTTP доступа) ---
  api:
    build:
      context: ./yt-kachalka-api/
      dockerfile: ./docker/api/Dockerfile
    container_name: yt-kachalka-api
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: yt-kachalka-nginx
    ports:
      - "8000:80" # Порт для доступа к API из браузера (http://localhost:8000)
    volumes:
      - ./yt-kachalka-api:/var/www/html
      - ./yt-kachalka-api/docker/nginx/nginx.conf:/etc/nginx/nginx.conf # Если у вас есть конфиг nginx, иначе нужен минимальный
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  node_modules:
